name: Emulator smoke test

# Builds the release APK like the release workflow, starts it on an emulator and prints the crash
# log, if any. Runs on pushes to the emulator-test branch.

on:
  push:
    branches:
      - emulator-test

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Prepare release build
      run: python3 .github/scripts/prepare_fork_release.py 0.0.0-test "$GITHUB_RUN_NUMBER"

    - name: Derive signing key
      env:
        SIGNING_SECRET: ${{ secrets.KEYSTORE }}
      run: |
        pip install --quiet 'cryptography>=44'
        python3 .github/scripts/derive_signing_key.py "$RUNNER_TEMP/release.p12" materialfiles

    - name: Build APKs
      env:
        STORE_FILE: ${{ runner.temp }}/release.p12
        STORE_PASSWORD: ${{ secrets.KEYSTORE }}
        KEY_ALIAS: materialfiles
        KEY_PASSWORD: ${{ secrets.KEYSTORE }}
      run: ./gradlew assembleRelease assembleDebug

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        script: bash .github/scripts/emulator_smoke_test.sh

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: emulator-logs
        path: emulator-*.txt
