name: Release

# Builds a signed APK of this fork and publishes it as a GitHub release, e.g. for Obtainium.
# Runs when the release branch is pushed (the version comes from .github/fork-version, and is
# skipped if already published), when a tag like v1.7.5-tv1 is pushed, or manually from the
# Actions tab.

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.7.5-tv1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Determine version
      id: version
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          VERSION="${INPUT_VERSION#v}"
        elif [ "$GITHUB_REF_TYPE" = "branch" ]; then
          VERSION="$(tr -d '[:space:]' < .github/fork-version)"
          VERSION="${VERSION#v}"
        else
          VERSION="${GITHUB_REF_NAME#v}"
        fi
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.-]*$'; then
          echo "Invalid version: $VERSION" >&2
          exit 1
        fi
        echo "name=$VERSION" >> "$GITHUB_OUTPUT"
        if gh release view "v$VERSION" > /dev/null 2>&1; then
          echo "Release v$VERSION already exists, nothing to do."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Prepare release build
      if: steps.version.outputs.skip != 'true'
      env:
        VERSION: ${{ steps.version.outputs.name }}
      run: python3 .github/scripts/prepare_fork_release.py "$VERSION" "$GITHUB_RUN_NUMBER"

    - name: Restore signing key
      if: steps.version.outputs.skip != 'true'
      env:
        # The keystore secret may be called KEYSTORE_BASE64 or KEYSTORE.
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KEYSTORE }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "Missing KEYSTORE_BASE64 (or KEYSTORE) secret" >&2
          exit 1
        fi
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

    - name: Build signed APK
      if: steps.version.outputs.skip != 'true'
      env:
        STORE_FILE: ${{ runner.temp }}/release.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Remove signing key
      if: always()
      run: rm -f "$RUNNER_TEMP/release.jks"

    - name: Publish release
      if: steps.version.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.name }}
      run: |
        APK="MaterialFiles-$VERSION.apk"
        cp app/build/outputs/apk/release/app-release.apk "$APK"
        gh release create "v$VERSION" "$APK" \
          --title "Material Files $VERSION" \
          --target "$GITHUB_SHA" \
          --notes "Build firmata del fork tonival94/MaterialFiles (senza Firebase)."
